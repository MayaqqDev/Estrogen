#forge-kotlin = { module = "dev.nyon:KotlinLangForge", version.ref = "klf" }
forge-kotlin = { module = "thedarkcolour:kotlinforforge", version.ref = "kff" }
forge-baubly = { module = "earth.terrarium.baubly:baubly-forge-1.20.1", version.ref = "baubly" }
