# Minecraft
minecraft = "1.21.1"
fabric = "0.18.5"

# Common Dependencies
kritter = "2.0.0-alpha.54"
kotlinx-serialization = "1.8.0"
kotlinx-coroutines = "1.10.1"
parchment = "2024.11.17"
devauth = "1.2.1"
